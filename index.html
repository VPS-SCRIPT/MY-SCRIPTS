<!DOCTYPE html>
<html lang="my" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUE VPS SCRIPT PORTAL (Admin)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#0a0f1d',
                            card: '#121929',
                            border: '#1e293b',
                            accent: '#06b6d4',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font (Padauk) -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Padauk', sans-serif;
            background-color: #0a0f1d;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .masked-text {
            font-family: monospace;
            letter-spacing: 2px;
        }
        .glow-card:hover {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.15);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between" oncontextmenu="return false;">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-y-[-100px] opacity-0 transition-all duration-300 bg-emerald-600/90 backdrop-blur-md text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-emerald-400/50">
        <i class="fa-solid fa-circle-check text-xl"></i>
        <span id="toast-message" class="font-bold">Script Copy ကူးပြီးပါပြီ!</span>
    </div>

    <!-- Admin Login Modal -->
    <div id="admin-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-cyber-card border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl relative">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-cyan-500/10 border border-cyan-500/30 rounded-full flex items-center justify-center mx-auto mb-3 text-cyan-400 text-xl">
                    <i class="fa-solid fa-user-gear"></i>
                </div>
                <h3 class="text-lg font-bold text-white">Admin Panel ဝင်ရောက်ရန်</h3>
                <p class="text-xs text-slate-400 mt-1">Script များကို ပြင်ဆင်/ဖျက်ရန် Admin Password ရိုက်ထည့်ပါ</p>
            </div>
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Admin Password</label>
                    <input type="password" id="admin-pass-input" placeholder="Password ရိုက်ထည့်ပါ..." required class="w-full bg-slate-950 text-slate-200 text-sm px-4 py-2.5 rounded-xl border border-slate-800 focus:outline-none focus:border-cyan-500">
                </div>
                <button type="submit" class="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl font-bold text-sm transition shadow-lg shadow-cyan-950">
                    Login ဝင်မည်
                </button>
            </form>
        </div>
    </div>

    <!-- Navigation Header -->
    <header class="bg-cyber-card/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-slate-900 rounded-xl border border-slate-700">
                    <i class="fa-solid fa-server text-cyan-400 text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                        JUE VPS SCRIPT
                    </h1>
                    <p class="text-xs text-slate-400">Secured Script Management Portal</p>
                </div>
            </div>
            
            <!-- Admin Controls -->
            <div class="flex items-center gap-2">
                <button id="admin-btn" onclick="openAdminModal()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-xl flex items-center gap-2 text-slate-300 transition">
                    <i class="fa-solid fa-lock text-cyan-400"></i>
                    <span id="admin-status-text">Admin Login</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-6xl mx-auto px-4 py-8 w-full flex-1 space-y-6">
        
        <!-- Admin Panel Controls (Visible only when logged in) -->
        <div id="admin-panel" class="hidden bg-slate-900/90 p-6 rounded-2xl border border-cyan-500/30 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h2 class="text-base font-bold text-cyan-400 flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> Admin Control Panel (Script အသစ်ထည့်ရန်)
                </h2>
                <button onclick="logoutAdmin()" class="text-xs text-rose-400 hover:underline">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>

            <!-- Add Script Form -->
            <form onsubmit="handleAddScript(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Script ခေါင်းစဉ် (Title)</label>
                    <input type="text" id="new-title" placeholder="ဥပမာ - X-ray X-UI Script" required class="w-full bg-slate-950 text-slate-200 text-xs px-3 py-2 rounded-lg border border-slate-800 focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">အသေးစိတ် (Subtitle)</label>
                    <input type="text" id="new-subtitle" placeholder="ဥပမာ - Web Panel Installer" class="w-full bg-slate-950 text-slate-200 text-xs px-3 py-2 rounded-lg border border-slate-800 focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Category (အမျိုးအစား)</label>
                    <select id="new-category" class="w-full bg-slate-950 text-slate-200 text-xs px-3 py-2 rounded-lg border border-slate-800 focus:outline-none focus:border-cyan-500">
                        <option value="xui">X-UI</option>
                        <option value="ssh">SSH PLUS</option>
                        <option value="udp">UDP Hysteria</option>
                        <option value="panel">ZiVPN Panel</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">OS Badge</label>
                    <input type="text" id="new-badge" placeholder="ဥပမာ - Ubuntu 20,22 / Debian 10" required class="w-full bg-slate-950 text-slate-200 text-xs px-3 py-2 rounded-lg border border-slate-800 focus:outline-none focus:border-cyan-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs text-slate-400 mb-1">Script Command</label>
                    <textarea id="new-command" rows="2" placeholder="bash <(curl -Ls ...)" required class="w-full bg-slate-950 text-slate-200 text-xs p-3 rounded-lg border border-slate-800 focus:outline-none focus:border-cyan-500 font-mono"></textarea>
                </div>
                <div class="md:col-span-2 flex justify-end">
                    <button type="submit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold transition flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Script အသစ် သိမ်းဆည်းမည်
                    </button>
                </div>
            </form>
        </div>

        <!-- Filter & Search Controls -->
        <div class="bg-gradient-to-r from-cyber-card via-slate-900 to-cyber-card p-5 rounded-2xl border border-slate-800 flex flex-col md:flex-row gap-4 justify-between items-center">
            <!-- Category Buttons -->
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto" id="category-filters">
                <button onclick="filterCategory('all')" class="cat-btn active px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-cyan-500 text-slate-950 border border-cyan-400 transition">
                    အားလုံး (All)
                </button>
                <button onclick="filterCategory('xui')" class="cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 transition">
                    X-UI
                </button>
                <button onclick="filterCategory('ssh')" class="cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 transition">
                    SSH PLUS
                </button>
                <button onclick="filterCategory('udp')" class="cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 transition">
                    UDP Hysteria
                </button>
                <button onclick="filterCategory('panel')" class="cat-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 transition">
                    ZiVPN Panel
                </button>
            </div>

            <!-- Search Input -->
            <div class="relative w-full md:w-64">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                <input type="text" id="search-input" onkeyup="renderScripts()" placeholder="Script ရှာရန်..." class="w-full bg-slate-950 text-slate-200 placeholder-slate-500 text-xs pl-9 pr-4 py-2 rounded-xl border border-slate-800 focus:outline-none focus:border-cyan-500">
            </div>
        </div>

        <!-- Script Cards Grid -->
        <div class="grid gap-5" id="script-list">
            <!-- Dynamic JavaScript Content -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-cyber-card border-t border-slate-800 py-6 mt-12 text-center text-slate-500 text-xs">
        <p>© 2026 JUE VPS SCRIPT. Protected Portal with Admin Console.</p>
    </footer>

    <!-- Main Logic Script -->
    <script>
        const ADMIN_PASS = "juevpnth@gmail.com";
        let isAdminLoggedIn = false;
        let activeCategory = 'all';
        let visibleStates = {};

        // Default Initial Data
        const initialScripts = [
            {
                id: 'xray-xui',
                category: 'xui',
                title: 'X-ray X-UI Script',
                subtitle: 'Multi-protocol VPN Web Panel',
                icon: 'fa-solid fa-shield-halved text-cyan-400',
                badge: 'All OS Supported',
                badgeColor: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/30',
                payload: 'YmFzaCA8KGN1cmwgLUxzIGh0dHBzOi8vcmF3LmdpdGh1YnVzZXJjb250ZW50LmNvbS9taHNhbmFlaS8zeC11aS9tYXN0ZXIvaW5zdGFsbC5zaCk='
            },
            {
                id: 'ssh-plus-u20',
                category: 'ssh',
                title: 'SSH PLUS (Ubuntu 20.04)',
                subtitle: 'SSH / WS / SSL VPN Manager',
                icon: 'fa-brands fa-ubuntu text-orange-400',
                badge: 'Ubuntu 20.04',
                badgeColor: 'bg-orange-500/10 text-orange-400 border-orange-500/30',
                payload: 'YXB0IHVwZGF0ZSAteSAmJiBhcHQgdXBncmFkZSAteSAmJiB3Z2V0IGh0dHBzOi8vZGFuaXlhbGFzYXQuY29tL3NzaC9QbHVzICYmIGNobW9kIDc3NyBQbHVzICYmIC4vUGx1cw=='
            },
            {
                id: 'ssh-plus-u22',
                category: 'ssh',
                title: 'SSH PLUS (Ubuntu 22.04)',
                subtitle: 'SSH / WS / SSL VPN Manager',
                icon: 'fa-brands fa-ubuntu text-orange-400',
                badge: 'Ubuntu 22.04',
                badgeColor: 'bg-orange-500/10 text-orange-400 border-orange-500/30',
                payload: 'YXB0IHVwZGF0ZSAteSAmJiBhcHQgdXBncmFkZSAteSAmJiB3Z2V0IGh0dHBzOi8vZGFuaXlhbGFzYXQuY29tL3NzaF91YnVudHUyMi9QbHVzICYmIGNobW9kIDc3NyBQbHVzICYmIC4vUGx1cw=='
            },
            {
                id: 'udp-hysteria',
                category: 'udp',
                title: 'UDP Hysteria Script',
                subtitle: 'High Speed UDP Protocol Installer',
                icon: 'fa-solid fa-bolt text-yellow-400',
                badge: 'Ubuntu 20,22,24 / Debian 10,12',
                badgeColor: 'bg-yellow-500/10 text-yellow-400 border-yellow-500/30',
                payload: 'YXB0LWdldCByZW1vdmUgY29tbWFuZC1ub3QtZm91bmQgLXkgJiYgd2dldCBodHRwczovL3Jhdy5naXRodWJ1c2VyY29udGVudC5jb20vSnVlc3NoL0p1ZXZwbnNjcmlwdC9tYWluL2luc3RhbGxfanVldWRwLnNoICYmIGNobW9kICt4IGluc3RhbGxfanVldWRwLnNoOyAuL2luc3RhbGxfanVldWRwLnNo'
            },
            {
                id: 'zivpn-panel',
                category: 'panel',
                title: 'ZIVPN PANEL SCRIPT',
                subtitle: 'ZiVPN Web Admin Panel',
                icon: 'fa-solid fa-sliders text-emerald-400',
                badge: 'Ubuntu 20,22,24 / Debian 10,12',
                badgeColor: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30',
                payload: 'd2dldCAtTyB6aS5zaCBodHRwczovL3Jhdy5naXRodWJ1c2VyY29udGVudC5jb20vSlZQTlNIT1AvQWRtaW4tWml2cG4vbWFpbi96aS5zaDsgc3VkbyBjaG1vZCAreCB6aS5zaDsgc3VkbyAuL3ppLnNo'
            }
        ];

        // LOAD FROM LOCALSTORAGE OR SET INITIAL
        function getScripts() {
            const saved = localStorage.getItem('jue_vps_scripts');
            if (saved) {
                return JSON.parse(saved);
            }
            localStorage.setItem('jue_vps_scripts', JSON.stringify(initialScripts));
            return initialScripts;
        }

        function saveScripts(scripts) {
            localStorage.setItem('jue_vps_scripts', JSON.stringify(scripts));
        }

        // BASE64 ENCODE/DECODE
        function encodePayload(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        function decodePayload(encoded) {
            try {
                return decodeURIComponent(escape(atob(encoded)));
            } catch (e) {
                return 'Protected Script';
            }
        }

        function generateMask() {
            return '*'.repeat(35);
        }

        // RENDER SCRIPTS LIST
        function renderScripts() {
            const container = document.getElementById('script-list');
            const scripts = getScripts();
            const searchKeyword = document.getElementById('search-input').value.toLowerCase();
            
            container.innerHTML = '';

            const filtered = scripts.filter(item => {
                const matchesCategory = activeCategory === 'all' || item.category === activeCategory;
                const matchesSearch = item.title.toLowerCase().includes(searchKeyword) || 
                                     item.badge.toLowerCase().includes(searchKeyword);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-cyber-card rounded-2xl border border-slate-800 text-slate-400 text-sm">
                        Script မရှိပါ။
                    </div>
                `;
                return;
            }

            filtered.forEach((item, index) => {
                const isShown = visibleStates[item.id] || false;
                const realCommand = decodePayload(item.payload);

                const card = document.createElement('div');
                card.className = "bg-cyber-card rounded-2xl border border-slate-800 p-5 shadow-lg glow-card transition-all";
                
                card.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-slate-900 flex items-center justify-center text-lg border border-slate-800">
                                <i class="${item.icon}"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-white text-base">${escapeHtml(item.title)}</h3>
                                ${item.subtitle ? `<p class="text-xs text-slate-400">${escapeHtml(item.subtitle)}</p>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs px-3 py-1 rounded-full border ${item.badgeColor}">
                                ${escapeHtml(item.badge)}
                            </span>
                            ${isAdminLoggedIn ? `
                                <button onclick="deleteScript('${item.id}')" class="text-xs bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500/20 px-2.5 py-1 rounded-lg transition" title="Script ဖျက်ရန်">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            ` : ''}
                        </div>
                    </div>

                    <!-- Command Box -->
                    <div class="bg-slate-950 rounded-xl p-3.5 border border-slate-800/80 font-mono text-xs flex items-center justify-between gap-3">
                        <div class="flex items-center gap-2 min-w-0 flex-1">
                            <span class="text-cyan-500 font-bold">$</span>
                            <div class="text-slate-300 break-all select-none">
                                ${isShown ? `<span class="text-emerald-400">${escapeHtml(realCommand)}</span>` : `<span class="masked-text text-slate-600">${generateMask()}</span>`}
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-2 shrink-0">
                            <button onclick="toggleView('${item.id}')" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition border border-slate-700 flex items-center gap-1">
                                <i class="${isShown ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'}"></i>
                                <span>${isShown ? 'Hide' : 'View'}</span>
                            </button>
                            <button onclick="copyScript('${item.payload}')" class="px-3 py-1.5 text-xs bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg transition font-medium flex items-center gap-1 shadow-md shadow-cyan-950">
                                <i class="fa-regular fa-copy"></i>
                                <span>Copy</span>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // TOGGLE VIEW
        function toggleView(id) {
            visibleStates[id] = !visibleStates[id];
            renderScripts();
        }

        // ADD NEW SCRIPT
        function handleAddScript(e) {
            e.preventDefault();
            const title = document.getElementById('new-title').value;
            const subtitle = document.getElementById('new-subtitle').value;
            const category = document.getElementById('new-category').value;
            const badge = document.getElementById('new-badge').value;
            const command = document.getElementById('new-command').value;

            let icon = 'fa-solid fa-code text-cyan-400';
            let badgeColor = 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30';

            if(category === 'xui') { icon = 'fa-solid fa-shield-halved text-cyan-400'; badgeColor = 'bg-indigo-500/10 text-indigo-400 border-indigo-500/30'; }
            else if(category === 'ssh') { icon = 'fa-brands fa-ubuntu text-orange-400'; badgeColor = 'bg-orange-500/10 text-orange-400 border-orange-500/30'; }
            else if(category === 'udp') { icon = 'fa-solid fa-bolt text-yellow-400'; badgeColor = 'bg-yellow-500/10 text-yellow-400 border-yellow-500/30'; }
            else if(category === 'panel') { icon = 'fa-solid fa-sliders text-emerald-400'; badgeColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30'; }

            const newScript = {
                id: 'script-' + Date.now(),
                category: category,
                title: title,
                subtitle: subtitle,
                icon: icon,
                badge: badge,
                badgeColor: badgeColor,
                payload: encodePayload(command)
            };

            const currentScripts = getScripts();
            currentScripts.unshift(newScript);
            saveScripts(currentScripts);

            e.target.reset();
            showToast("Script အသစ် ထည့်သွင်းပြီးပါပြီ!");
            renderScripts();
        }

        // DELETE SCRIPT
        function deleteScript(id) {
            if (confirm("ဤ Script ကို ဖျက်ရန် သေချာပါသလား?")) {
                let scripts = getScripts();
                scripts = scripts.filter(s => s.id !== id);
                saveScripts(scripts);
                showToast("Script ဖျက်ပြီးပါပြီ!");
                renderScripts();
            }
        }

        // ADMIN LOGIN / LOGOUT
        function openAdminModal() {
            if (isAdminLoggedIn) return;
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass-input').value;
            if (pass === ADMIN_PASS) {
                isAdminLoggedIn = true;
                closeAdminModal();
                document.getElementById('admin-pass-input').value = '';
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('admin-status-text').innerText = "Admin Logged In";
                document.getElementById('admin-btn').classList.add('border-emerald-500/50', 'text-emerald-400');
                showToast("Admin အဖြစ် Login ဝင်ရောက်ပြီးပါပြီ");
                renderScripts();
            } else {
                showToast("Admin Password မှားယွင်းနေပါသည်!", true);
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('admin-status-text').innerText = "Admin Login";
            document.getElementById('admin-btn').classList.remove('border-emerald-500/50', 'text-emerald-400');
            showToast("Admin မှ ထွက်လိုက်ပါပြီ");
            renderScripts();
        }

        // CATEGORY FILTER
        function filterCategory(category) {
            activeCategory = category;
            const buttons = document.querySelectorAll('.cat-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-cyan-500', 'text-slate-950', 'border-cyan-400');
                btn.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700');
            });

            event.target.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-700');
            event.target.classList.add('bg-cyan-500', 'text-slate-950', 'border-cyan-400');

            renderScripts();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function copyScript(payload) {
            const realCommand = decodePayload(payload);
            const textarea = document.createElement('textarea');
            textarea.value = realCommand;
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showToast("Script ကို Copy ကူးပြီးပါပြီ!");
            } catch (err) {
                showToast("Copy မကူးနိုင်ပါ!", true);
            }
            
            document.body.removeChild(textarea);
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            
            if(isError) {
                toast.classList.remove('bg-emerald-600/90', 'border-emerald-400/50');
                toast.classList.add('bg-rose-600/90', 'border-rose-400/50');
            } else {
                toast.classList.remove('bg-rose-600/90', 'border-rose-400/50');
                toast.classList.add('bg-emerald-600/90', 'border-emerald-400/50');
            }

            toast.classList.remove('translate-y-[-100px]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-100px]', 'opacity-0');
            }, 2500);
        }

        // ANTI-INSPECT PROTECTION
        document.addEventListener('keydown', function(e) {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
            ) {
                e.preventDefault();
                showToast("Developer Tools အသုံးပြုခွင့် ပိတ်ထားပါသည်!", true);
            }
        });

        window.onload = renderScripts;
    </script>
</body>
</html>
